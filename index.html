<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ByteAlity Remake</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #9cf; font: 8px/1.6 'Press Start 2P', monospace; -webkit-font-smoothing: none; font-smooth: never; text-rendering: optimizeSpeed; }
    button, select, input { font: inherit; }
    #stage { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, #0d2f42 0%, #07161f 55%, #02080d 100%); }
    canvas { display: block; cursor: crosshair; position: absolute; inset: 0; }
    /* debug panel (hidden by default) */
    #panel { position: absolute; bottom: 8px; right: 8px; width: 340px; padding: 8px 10px; background: rgba(0, 8, 40, .88); border: 2px solid #2a3f9a; }
    #panel h1 { margin: 0 0 8px; font-size: 8px; color: #ff0; font-weight: 400; }
    #panel label, #panel .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 5px 0; }
    #panel select, #panel input[type=range] { max-width: 140px; background: #0a1450; color: #9cf; border: 2px solid #2a3f9a; font-size: 8px; }
    #panel button { background: #0a1450; color: #9cf; border: 2px solid #2a3f9a; padding: 3px 6px; cursor: pointer; font-size: 8px; }
    #panel button:hover { background: #1a2a80; }
    #stats { white-space: pre; color: #ff0; margin-top: 8px; }
    #help { color: #789; margin-top: 8px; line-height: 1.8; }
    #frame { position: absolute; inset: 0; }
    /* tower toolbar */
    #toolbar { --tb: 72px; position: absolute; top: 0; left: 8px; right: 372px; min-height: 104px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 4px; padding: 4px; box-sizing: border-box; pointer-events: none; }
    #toolbar button { pointer-events: auto; position: relative; width: var(--tb); height: var(--tb); padding: 0; background: rgba(8, 14, 60, .75); border: 2px solid #2a3f9a; cursor: pointer; }
    #toolbar button[hidden] { display: none; }
    #toolbar button.dim canvas { opacity: .35; }
    #toolbar button:hover { border-color: #8af; }
    #toolbar button.sel { border-color: #ff0; box-shadow: 0 0 0 1px #ff0; }
    #toolbar canvas { width: 100%; height: 100%; display: block; }
    #toolbar .n { position: absolute; right: 4px; bottom: 2px; font-size: 14px; line-height: 1; color: #ff0; pointer-events: none; text-shadow: 1px 1px 0 #000; }
    /* top-right HUD (drawn at 2x) */
    #hud { position: absolute; right: 8px; top: 8px; width: 176px; transform-origin: top right; padding: 4px 8px; background: rgba(0, 8, 40, .85); border: 2px solid #2a3f9a; pointer-events: none; }
    #hud .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; line-height: 1.6; }
    #hud small { color: #789; font-size: 8px; }
    #hud b { color: #ff0; font-size: 8px; font-weight: 400; margin-left: auto; }
    #hud .cr b { font-size: 16px; }
    #hud b.dim, #hud .dim { color: #567; font-size: 8px; }
    #hud b.ok { color: #7f7; }
    #hud u { text-decoration: none; color: #9cf; }
    #hud i { font-style: normal; font-size: 8px; }
    #hud button { pointer-events: auto; width: 100%; margin-top: 4px; padding: 4px 0; background: #0a1450; color: #9cf; border: 2px solid #2a3f9a; cursor: pointer; font-size: 8px; }
    #hud button:hover { background: #1a2a80; }
    #hud.pulse { border-color: #ff0; box-shadow: 0 0 0 1px #ff0; }
    #hud .cr b.deny { animation: deny .5s steps(1) 1; }
    @keyframes deny { 0%, 40%, 80% { color: #f33; } 20%, 60%, 100% { color: #ff0; } }
    /* selected-tower card (drawn at 2x) */
    #card { position: absolute; right: 8px; bottom: 8px; width: 192px; transform: scale(2); transform-origin: bottom right; padding: 6px 8px; background: rgba(0, 8, 40, .9); border: 2px solid #ff0; pointer-events: none; }
    #card.hover { border-color: #2a3f9a; }
    #card[hidden] { display: none; }
    #card .t { margin-bottom: 4px; } #card .t span { color: #ff0; margin-left: 6px; }
    #card .r { display: flex; gap: 8px; line-height: 1.9; } #card .r b { width: 64px; color: #789; font-weight: 400; } #card .r i { color: #7f7; font-style: normal; }
    #card .cost { color: #ff0; } #card .cost.no { color: #f55; }
    #card .hint { margin-top: 4px; color: #567; line-height: 1.6; }
    /* end-of-level overlay */
    #overlay { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); text-align: center; padding: 20px 28px; background: rgba(0, 8, 40, .92); border: 2px solid #2a3f9a; }
    #overlay[hidden] { display: none; }
    #overlay h2 { margin: 0 0 12px; color: #ff0; font-size: 16px; font-weight: 400; }
    #overlay p { margin: 8px 0; color: #9cf; line-height: 1.6; }
    #overlay .b { display: flex; gap: 8px; justify-content: center; }
    #overlay button { margin-top: 12px; background: #0a1450; color: #9cf; border: 2px solid #2a3f9a; padding: 8px 12px; cursor: pointer; font-size: 8px; }
    #overlay button:hover { background: #1a2a80; }
    #menuBtn { position: absolute; left: 8px; top: 8px; background: rgba(0, 8, 40, .85); color: #9cf; border: 2px solid #2a3f9a; padding: 6px 10px; cursor: pointer; font-size: 8px; }
    #soundBtn { position: absolute; left: 8px; top: 40px; background: rgba(0, 8, 40, .85); color: #9cf; border: 2px solid #2a3f9a; padding: 6px 10px; cursor: pointer; font-size: 8px; }
    #soundBtn:hover { background: #1a2a80; }
    #menuBtn:hover { background: #1a2a80; }
    /* title + level select */
    .screen { position: absolute; inset: 0; background: linear-gradient(rgba(46, 230, 255, .05) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, rgba(46, 230, 255, .05) 1px, transparent 1px) 0 0 / 24px 24px, radial-gradient(ellipse at 50% 0%, #0d2f42 0%, #07161f 55%, #02080d 100%); display: flex; flex-direction: column; align-items: center; z-index: 20; color: #bfeaf5; overflow: hidden; }
    .screen[hidden] { display: none; }
    .screen button { color: #bfeaf5; background: #0b1620; border: 2px solid #1d4a5c; cursor: pointer; }
    .screen button:hover:not(:disabled) { border-color: #bfeaf5; background: #123044; }
    #title { justify-content: center; gap: 16px; }
    #title h1 { margin: 0; font-size: 64px; font-weight: 400; text-align: center; color: #bfeaf5; line-height: 1.5; }
    #title h1 em { font-style: normal; display: block; font-size: 34px; }
    #title .sub { margin: 0 0 8px; color: #5f9db3; font-size: 13px; }
    #title .big { width: 280px; max-width: 80%; padding: 16px 0; font-size: 22px; }
    #title .small { padding: 8px 16px; font-size: 13px; }
    #title .credit { margin: 16px 0 0; color: #5f9db3; font-size: 13px; line-height: 1.8; text-align: center; padding: 0 12px; }
    #title .icons { display: flex; gap: 24px; } #title .icons span { display: block; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #levels { justify-content: flex-start; }
    #levels .bar { width: min(800px, 94%); display: flex; align-items: center; gap: 16px; padding: 16px 0 12px; flex: none; }
    #levels .bar h2 { margin: 0; font-size: 22px; font-weight: 400; flex: 1; text-align: center; }
    #levels .bar button { padding: 8px 12px; font-size: 13px; }
    #levels .kills { color: #5f9db3; font-size: 13px; text-align: right; min-width: 200px; line-height: 1.8; } #levels .kills b { color: #ff8a2e; font-weight: 400; }
    #levels .rows { width: min(800px, 94%); overflow-y: auto; flex: 1; padding-right: 8px; scrollbar-color: #1d4a5c transparent; }
    #levels .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    #levels .row.locked { opacity: .45; }
    #levels .need { flex-basis: 100%; font-size: 13px; color: #5f9db3; margin-bottom: -4px; }
    #levels .card { position: relative; flex: 1 1 210px; min-width: 200px; max-width: calc(33.34% - 8px); display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; text-align: left; }
    #levels .card:disabled { cursor: default; }
    #levels .card canvas { width: 100%; height: auto; background: #02080d; image-rendering: pixelated; }
    #levels .card .no { position: absolute; left: 14px; top: 12px; color: #ff8a2e; font-size: 22px; text-shadow: 2px 2px 0 #000; }
    #levels .card .st { position: absolute; right: 14px; top: 14px; width: 12px; height: 12px; background: #666; box-shadow: 0 0 0 2px #000; }
    #levels .card.failed .st { background: #e03030; } #levels .card.partial .st { background: #ffcc00; } #levels .card.goal .st { background: #3f3; }
    #levels .card .nm { font-size: 13px; padding: 0 2px; line-height: 1.6; }
    #levels .card .meta { font-size: 13px; color: #5f9db3; padding: 0 2px 2px; line-height: 1.6; }
    #achievements { justify-content: flex-start; }
    #achievements .bar { width: min(800px, 94%); display: flex; align-items: center; gap: 16px; padding: 16px 0 12px; flex: none; }
    #achievements .bar h2 { margin: 0; font-size: 22px; font-weight: 400; flex: 1; text-align: center; }
    #achievements .bar button { padding: 8px 12px; font-size: 13px; }
    #achievements .kills { color: #5f9db3; text-align: right; min-width: 80px; } #achievements .kills b { color: #ff8a2e; font-weight: 400; }
    #achievements .list { width: min(800px, 94%); overflow-y: auto; flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; align-content: start; }
    #achievements .ach { display: flex; gap: 10px; align-items: center; padding: 8px; border: 2px solid #1d4a5c; background: #0b1620; opacity: .5; }
    #achievements .ach.got { opacity: 1; border-color: #bfeaf5; }
    #achievements .ach .mark { flex: none; width: 16px; height: 16px; border: 2px solid #1d4a5c; color: #3f3; display: grid; place-items: center; }
    #achievements .ach b { display: block; font-weight: 400; color: #ff8a2e; margin-bottom: 4px; }
    #achievements .ach small { color: #bfeaf5; font-size: 13px; line-height: 1.6; display: block; }
    #achievements .stats { flex: none; padding: 12px 0; color: #5f9db3; font-size: 13px; text-align: center; }
    #toasts { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 10px 14px; background: rgba(0, 8, 40, .95); border: 2px solid #ff8a2e; text-align: center; animation: toast 4.5s steps(1) forwards; }
    .toast small { display: block; color: #ff8a2e; margin-bottom: 6px; } .toast b { display: block; font-weight: 400; font-size: 22px; color: #fff; margin-bottom: 6px; } .toast span { color: #bfeaf5; }
    @keyframes toast { 0% { opacity: 0; } 5% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
    #levels .tabs { width: min(800px, 94%); display: flex; gap: 8px; margin-bottom: 12px; flex: none; flex-wrap: wrap; }
    #levels .tabs button { padding: 8px 12px; font-size: 13px; color: #5f9db3; }
    #levels .tabs button.on { color: #ff8a2e; border-color: #bfeaf5; }
    #levels .tabs .genlink { margin-left: auto; padding: 8px 12px; font-size: 13px; color: #bfeaf5; background: #0b1620; border: 2px solid #1d4a5c; text-decoration: none; line-height: 1.6; } #levels .tabs .genlink:hover { border-color: #bfeaf5; }
    #levels .tabs .genlink + .imp { margin-left: 0; }
    #levels .tabs .imp { margin-left: auto; }
    #levels .note { width: min(800px, 94%); color: #ff8a2e; font-size: 13px; margin-bottom: 10px; flex: none; }
    #levels .empty { color: #5f9db3; line-height: 1.8; text-align: center; padding: 40px 12px; font-size: 13px; } #levels .empty b { color: #bfeaf5; font-weight: 400; }
    #levels .card .rm { position: absolute; right: 36px; top: 12px; color: #f55; font-size: 14px; padding: 0 4px; border: 2px solid #1d4a5c; background: #0b1620; cursor: pointer; } #levels .card .rm:hover { border-color: #f55; }
    #levels .foot { flex: none; display: flex; gap: 12px; padding: 8px 0 12px; }
    #levels .foot button { padding: 6px 10px; font-size: 13px; color: #5f9db3; }
    .screen { font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; text-rendering: auto; }
    .screen canvas { position: static; cursor: inherit; }
    .screen button, .screen .genlink { font-family: inherit; transition: background .12s, border-color .12s, box-shadow .12s; }
    #title h1 { text-shadow: 0 0 24px rgba(46, 230, 255, .45); font-weight: 600; letter-spacing: 1px; }
    #title h1 em { font-weight: 400; letter-spacing: 6px; text-transform: uppercase; color: #5f9db3; margin-top: 4px; }
    #title .sub { text-transform: uppercase; letter-spacing: 4px; margin: 0 0 16px; }
    #title .big { font-weight: 600; background: #2ee6ff; color: #021014; border-color: #2ee6ff; box-shadow: 0 0 18px rgba(46, 230, 255, .45); }
    #title .big:hover:not(:disabled) { background: #7af0ff; border-color: #7af0ff; }
    #title .credit { margin-top: 24px; }
    #title .icons { min-height: 48px; align-items: center; }
        #levels .card .nm { font-weight: 600; color: #fff; font-size: 15px; }
    #levels .need { text-transform: uppercase; letter-spacing: 1px; }
    #levels .bar h2, #achievements .bar h2 { font-weight: 600; color: #fff; }
    #levels .tabs button.on { background: #123044; }
      /* Ko-fi QR, bottom right of the menu screens */
    #kofi { position: absolute; right: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #bfeaf5; text-decoration: none; font: 12px/1.4 'Fredoka', system-ui, sans-serif; text-align: center; white-space: nowrap; transition: filter .12s; }
    #kofi[hidden] { display: none; }
    #kofi:hover { filter: drop-shadow(0 0 8px rgba(46, 230, 255, .5)); }
    #kofi img { display: block; image-rendering: pixelated; border: 2px solid #2ee6ff; }
    /* circuit-board look: square, neon-edged panels */
    .screen button, .screen .genlink, #levels .card, #achievements .ach, #levels .card canvas, .toast { border-radius: 0; }
    .screen button:hover:not(:disabled), #levels .tabs .genlink:hover { box-shadow: 0 0 12px rgba(46, 230, 255, .35); }
    #levels .card, #achievements .ach { background: rgba(11, 22, 32, .85); }
    #levels .card:hover:not(:disabled) { box-shadow: 0 0 14px rgba(46, 230, 255, .35); }
    #levels .card canvas { background: #04090e; border: 1px solid #12303e; }
    #levels .card.failed .st, #levels .card.partial .st, #levels .card.goal .st { box-shadow: 0 0 6px currentColor, 0 0 0 2px #02080d; }
    #levels .card.failed .st { color: #e03030; } #levels .card.partial .st { color: #ff8a2e; } #levels .card.goal .st { color: #3f3; }
    #levels .card.partial .st { background: #ff8a2e; }
    #levels .bar h2, #achievements .bar h2 { text-shadow: 0 0 14px rgba(46, 230, 255, .4); }
    #levels .tabs button.on { background: #123044; border-color: #2ee6ff; box-shadow: 0 0 10px rgba(46, 230, 255, .3); }
    #levels .row.locked .card canvas { filter: saturate(.4); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="panel"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
